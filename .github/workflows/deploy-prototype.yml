name: Deploy Prototype to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'prototype/**'
      - '.github/workflows/deploy-prototype.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: prototype/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: prototype

      - name: Build
        run: pnpm run build
        working-directory: prototype
        env:
          BASE_URL: /Proyecto-Plataformas-Moviles/

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: prototype/dist
          branch: gh-pages
