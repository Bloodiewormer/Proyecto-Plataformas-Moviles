spring.application.name=glifo-api
server.port=8080

# Perfil activo: permite tener configuraciones distintas (local, nube) sin reescribir
# este archivo; se crea un application-<perfil>.properties y se cambia este valor.
spring.profiles.active=default

# --- Conexión a PostgreSQL ---
# Antes de correr el backend hay que crear en pgAdmin el login role "glifo" (password
# 12345, todos los privilegios) y la base de datos "glifo" con ese usuario como owner.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=glifo
spring.datasource.url=jdbc:postgresql://localhost:5432/glifo
spring.datasource.password=12345

# --- Hibernate (JPA) ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Imprime en consola cada sentencia SQL; se apaga en producción.
spring.jpa.show-sql=true
# validate: validate the schema, makes no changes to the database.
# update: update the schema.
# create: creates the schema, destroying previous data.
# create-drop: drop the schema at the end of the session.
spring.jpa.hibernate.ddl-auto=create
# Con create, Hibernate ejecuta src/main/resources/import.sql al terminar de crear las
# tablas: ahí están los roles, privilegios, las cuentas demo del frontend y el curso demo.
# Las tablas, CHECK, UNIQUE, índices y columnas JSONB salen de las anotaciones de las
# entidades; docs/db/schema.sql es el DDL que genera Hibernate, como referencia (D-27).

# --- Glifo ---
glifo.jwt.secret=glifo-dev-secret-key-change-in-production-must-be-at-least-256-bits-long-for-hs256
# 24 horas
glifo.jwt.expiration-ms=86400000
glifo.cors.allowed-origins=*
