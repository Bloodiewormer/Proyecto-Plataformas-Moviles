spring.application.name=glifo-api
server.address=0.0.0.0
server.port=${PORT:8080}

spring.datasource.url=${DB_JDBC_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.hbm2ddl.charset_name=UTF-8
spring.sql.init.mode=never

url.api.v1=/api/v1
url.health=${url.api.v1}/health
url.auth=${url.api.v1}/auth
url.courses=${url.api.v1}/courses
url.enrollments=${url.api.v1}/enrollments
url.notes=${url.api.v1}/notes
url.devices=${url.api.v1}/devices
url.sync=${url.api.v1}/sync
url.ai-usage=${url.api.v1}/ai-usage
url.admin=${url.api.v1}/admin

glifo.jwt.secret=${JWT_SECRET}
glifo.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
glifo.cors.allowed-origins=${CORS_ALLOWED_ORIGIN}

glifo.fcm.enabled=${GLIFO_FCM_ENABLED:false}
glifo.fcm.project-id=${GLIFO_FCM_PROJECT_ID:glifoapp}
glifo.fcm.credentials-path=${GLIFO_FCM_CREDENTIALS_PATH:}
glifo.fcm.credentials-file=${GLIFO_FCM_CREDENTIALS_FILE:}
glifo.fcm.use-application-default=${GLIFO_FCM_USE_APPLICATION_DEFAULT:false}
glifo.fcm.max-attempts=${GLIFO_FCM_MAX_ATTEMPTS:3}
glifo.fcm.retry-backoff-ms=${GLIFO_FCM_RETRY_BACKOFF_MS:200}

openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:60}

# Tarifas en USD por millón de tokens (1M tokens). El precio debe verificarse en la página oficial de OpenAI.
glifo.ai.pricing.rates[gpt-4o-mini].input-usd-per-million=${GLIFO_PRICE_GPT4OMINI_INPUT:0.15}
glifo.ai.pricing.rates[gpt-4o-mini].output-usd-per-million=${GLIFO_PRICE_GPT4OMINI_OUTPUT:0.60}
glifo.ai.pricing.rates[gpt-4o].input-usd-per-million=${GLIFO_PRICE_GPT4O_INPUT:2.50}
glifo.ai.pricing.rates[gpt-4o].output-usd-per-million=${GLIFO_PRICE_GPT4O_OUTPUT:10.00}

server.error.include-message=never
server.error.include-stacktrace=never
