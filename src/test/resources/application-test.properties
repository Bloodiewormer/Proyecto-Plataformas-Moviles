# --- Conexión a PostgreSQL para Tests ---
# Antes de correr los tests hay que crear en pgAdmin la base de datos "glifo_test" con el
# login role "glifo" como owner (password 12345, todos los privilegios). Los tests usan esta
# base separada con create-drop para no tocar ni reiniciar los datos de desarrollo.
spring.datasource.url=jdbc:postgresql://localhost:5432/glifo_test
spring.jpa.hibernate.ddl-auto=create-drop
