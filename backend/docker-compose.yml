# Alternativa a crear las bases en pgAdmin: levanta PostgreSQL con el mismo usuario, clave y
# bases que application.properties (glifo) y application-test.properties (glifo_test).
#   docker compose up -d
services:
  postgres:
    image: postgres:18
    container_name: glifo-postgres
    environment:
      POSTGRES_USER: glifo
      POSTGRES_PASSWORD: "12345"
      POSTGRES_DB: glifo
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
