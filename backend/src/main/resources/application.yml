server:
  port: 8080

spring:
  application:
    name: glifo-api
  datasource:
    url: jdbc:postgresql://localhost:5432/glifo
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

glifo:
  jwt:
    secret: glifo-dev-secret-key-change-in-production-must-be-at-least-256-bits-long-for-hs256
    expiration-ms: 86400000  # 24 hours
  cors:
    allowed-origins: "*"
