spring.application.name=glifo-api
server.port=8080

# Perfil activo: permite tener configuraciones distintas (local, nube) sin reescribir
# este archivo; se crea un application-<perfil>.properties y se cambia este valor.
spring.profiles.active=default

# --- Conexión a PostgreSQL ---
# Antes de correr el backend hay que crear en pgAdmin el login role "glifo" (password
# 12345, todos los privilegios) y la base de datos "glifo" con ese usuario como owner.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=glifo
spring.datasource.url=jdbc:postgresql://localhost:5432/glifo
spring.datasource.password=12345

# --- Hibernate (JPA) ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Imprime en consola cada sentencia SQL; se apaga en producción.
spring.jpa.show-sql=true
# validate: validate the schema, makes no changes to the database.
# update: update the schema.
# create: creates the schema, destroying previous data.
# create-drop: drop the schema at the end of the session.
spring.jpa.hibernate.ddl-auto=create
# Con create, Hibernate ejecuta src/main/resources/import.sql al terminar de crear las
# tablas: ahí están los roles, privilegios, las cuentas demo del frontend y el curso demo.
# Las tablas, CHECK, UNIQUE, índices y columnas JSONB salen de las anotaciones de las
# entidades; docs/db/schema.sql es el DDL que genera Hibernate, como referencia (D-27).

# --- Web API (rutas versionadas) ---
# Cada @RestController toma su ruta de aquí (@RequestMapping("${url.notes}")). Si un cambio
# rompe a los clientes, se publica una v2 sin tocar la v1 que ya usan las apps.
url.api.v1=/api/v1
url.health=${url.api.v1}/health
url.auth=${url.api.v1}/auth
url.courses=${url.api.v1}/courses
url.enrollments=${url.api.v1}/enrollments
url.notes=${url.api.v1}/notes
url.devices=${url.api.v1}/devices
url.sync=${url.api.v1}/sync
url.ai-usage=${url.api.v1}/ai-usage
url.admin=${url.api.v1}/admin
url.users=${url.api.v1}/users

# --- Glifo ---
glifo.jwt.secret=${JWT_SECRET:glifo-dev-secret-key-change-in-production-must-be-at-least-256-bits-long-for-hs256}
# 24 horas
glifo.jwt.expiration-ms=86400000
glifo.cors.allowed-origins=*

# --- IA / OpenAI (D-26) ---
spring.config.import=optional:file:.env[.properties]
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.base-url=https://api.openai.com/v1
openai.timeout-seconds=60

# --- Notificaciones Push / Firebase Cloud Messaging (issue #48) ---
glifo.fcm.enabled=${GLIFO_FCM_ENABLED:true}
glifo.fcm.project-id=${GLIFO_FCM_PROJECT_ID:glifoapp}
glifo.fcm.credentials-path=${GLIFO_FCM_CREDENTIALS_PATH:}
glifo.fcm.credentials-file=${GLIFO_FCM_CREDENTIALS_FILE:}
glifo.fcm.use-application-default=${GLIFO_FCM_USE_APPLICATION_DEFAULT:false}
glifo.fcm.max-attempts=${GLIFO_FCM_MAX_ATTEMPTS:3}
glifo.fcm.retry-backoff-ms=${GLIFO_FCM_RETRY_BACKOFF_MS:200}

# --- Tarifas para el costo estimado de ai_calls (#46) ---
# Unidad que espera CostCalculator: USD por millón de tokens (1M tokens), por modelo (el nombre que reporta el proveedor, entre corchetes).
# Sin tarifa, el costo de esa llamada queda NULL (desconocido), nunca 0.
# NOTA: El precio debe verificarse en la página oficial de precios de OpenAI (https://openai.com/api/pricing/).
glifo.ai.pricing.rates[gpt-4o-mini].input-usd-per-million=${GLIFO_PRICE_GPT4OMINI_INPUT:0.15}
glifo.ai.pricing.rates[gpt-4o-mini].output-usd-per-million=${GLIFO_PRICE_GPT4OMINI_OUTPUT:0.60}
glifo.ai.pricing.rates[gpt-4o].input-usd-per-million=${GLIFO_PRICE_GPT4O_INPUT:2.50}
glifo.ai.pricing.rates[gpt-4o].output-usd-per-million=${GLIFO_PRICE_GPT4O_OUTPUT:10.00}

spring.jpa.properties.hibernate.hbm2ddl.charset_name=UTF-8

# --- Límites de carga multipart (sílabo PDF) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
