# Base URL of the Lab 3 mock API (Mockoon, see D-25). This file is gitignored, so each
# team member sets whatever their own machine needs and nothing environment-specific ever
# reaches the repo. If this line is absent the build falls back to the emulator's standard
# host alias (http://10.0.2.2:3000/api/v1/) — see app/build.gradle.kts.
#
# Why a LAN IP here instead of 10.0.2.2: on this machine the emulator's 10.0.2.2 alias
# doesn't route (SYNs hang), and `adb reverse` — the other workaround — tunnels over the
# debug bridge, which ignores the emulator's Wi-Fi toggle and so can't demo the offline
# error path. The LAN IP goes through the emulator's real virtual NIC, so switching Wi-Fi
# off in the emulator genuinely triggers AppError.NoConnection.
#
# DHCP-assigned: re-check with `ipconfig` if the app suddenly stops reaching Mockoon.
mock.api.base.url=http://192.168.100.29:3000/api/v1/
